[package]
name = "php2rust-doctrine-dbal"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Port of the doctrine/dbal database abstraction layer"

[dependencies]
php-value = { workspace = true }
php-regex = { workspace = true }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.54.1", features = ["sync"] }
sha1 = "0.10"
sha2 = "0.10"
futures-core = { version = "0.3.34", optional = true }
symfony-console = { workspace = true, optional = true }

[features]
# The `Tools\Console` commands, on symfony-console (upstream suggests
# symfony/console for them).
console = ["dep:symfony-console", "tokio/rt", "tokio/rt-multi-thread"]
# The pdo_mysql driver (sqlx's MySQL client; RSA for caching_sha2_password
# without TLS, the default of MySQL 8.4).
pdo_mysql = ["sqlx/mysql-rsa", "dep:futures-core"]

[dev-dependencies]
php-value = { workspace = true, features = ["vectors"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
