[workspace]
members = ["crates/php2rust-doctrine-dbal"]
resolver = "3"

# PHP behaviour crates from php2rust-compatibility-tools, pinned to a
# commit. The alias keeps `php_value::` in code. To work on both
# repositories, override the git source with a local path in an
# uncommitted .cargo/config.toml (see README.md).
[workspace.dependencies]
php-value = { package = "php2rust-value", git = "https://github.com/php2rust/compatibility-tools", rev = "4585a15ed0263257317cdf818ebcad7ed7542db8" }
# Slice SchemaManager: PHP's preg_* patterns (the SQLite schema manager
# parses CREATE TABLE statements with them).
php-regex = { package = "php2rust-regex", git = "https://github.com/php2rust/compatibility-tools", rev = "4585a15ed0263257317cdf818ebcad7ed7542db8" }
# symfony/console for the `Tools\Console` commands (optional in upstream's
# composer.json too: `console` feature). It uses the same php-value rev.
symfony-console = { package = "php2rust-symfony-console", git = "https://github.com/php2rust/symfony-console-rs", rev = "8a0e6960e5fcc28f822ae9fd8131c5b8e5703085" }

# Lints for every member (`[lints] workspace = true`), the same rule set as
# symfony-rs and php2rust-compatibility-tools.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that only add noise to a port.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# AGENTS.md rules: no panics on external input, no stubs or debug
# output left behind. Tests may unwrap (clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "deny"
print_stdout = "warn"

# Keep source locations for normal development without full debug symbols.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
